<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eiris - Reset Password</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="shortcut icon" href="images/favicon.svg">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Header -->
    <nav class="navbar navbar-expand-lg bg-night-blue navbar-dark sticky-top shadow-sm py-2 border-bottom animate-slide-down"
        style="border-color: var(--eiris-night-blue-shadow) !important;">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center fw-bold fs-4 text-sand-tan" href="index.html">
                <div class="hover-rotate me-2">
                    <i class="bi bi-car-front-fill" style="color: var(--eiris-sand-tan); font-size: 1.5rem;"></i>
                </div>
                <span style="letter-spacing: 1px;">Eiris</span>
            </a>
        </div>
    </nav>

    <div class="container py-5 min-vh-100 d-flex align-items-center justify-content-center">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden animate-fade-in-up"
            style="max-width: 500px; width: 100%;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-key-fill text-night-blue mb-3" style="font-size: 3rem;"></i>
                    <h3 class="fw-bold text-night-blue-shadow">Create New Password</h3>
                    <p class="text-muted">Enter your new password below.</p>
                </div>

                <form id="resetPasswordForm" onsubmit="handleResetPassword(event)">
                    <div class="mb-3">
                        <label class="form-label fw-bold text-night-blue-shadow">New Password</label>
                        <div class="input-group">
                            <input type="password" id="newPassword" class="form-control form-control-lg bg-light border-0"
                                placeholder="Enter new password" required minlength="6">
                            <button class="btn bg-light border-0 text-secondary px-3" type="button" onclick="togglePasswordVisibility('newPassword', 'eyeIcon1')">
                                <i class="bi bi-eye-slash" id="eyeIcon1"></i>
                            </button>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold text-night-blue-shadow">Confirm Password</label>
                        <div class="input-group">
                            <input type="password" id="confirmPassword" class="form-control form-control-lg bg-light border-0"
                                placeholder="Confirm new password" required minlength="6">
                            <button class="btn bg-light border-0 text-secondary px-3" type="button" onclick="togglePasswordVisibility('confirmPassword', 'eyeIcon2')">
                                <i class="bi bi-eye-slash" id="eyeIcon2"></i>
                            </button>
                        </div>
                        <div id="resetErrorMsg" class="text-danger small fw-bold mt-2 d-none">Error message here</div>
                        <div id="resetSuccessMsg" class="text-success small fw-bold mt-2 d-none">Success message here</div>
                    </div>
                    
                    <button type="submit" id="resetBtn"
                        class="btn btn-secondary-custom btn-lg rounded-pill w-100 shadow-sm fw-bold">Reset Password</button>
                    
                    <div class="text-center mt-4">
                        <a href="admin-login.html" class="text-decoration-none small fw-bold text-secondary">
                            <i class="bi bi-arrow-left"></i> Back to Login
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Axios and API Service -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/apiService.js"></script>

    <script>
        function togglePasswordVisibility(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const eyeIcon = document.getElementById(iconId);
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('bi-eye-slash');
                eyeIcon.classList.add('bi-eye');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('bi-eye');
                eyeIcon.classList.add('bi-eye-slash');
            }
        }

        async function handleResetPassword(e) {
            e.preventDefault();
            
            // Get token from URL
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const resetBtn = document.getElementById('resetBtn');
            const errorMsg = document.getElementById('resetErrorMsg');
            const successMsg = document.getElementById('resetSuccessMsg');

            errorMsg.classList.add('d-none');
            successMsg.classList.add('d-none');

            if (!token) {
                errorMsg.textContent = "Invalid or missing reset token.";
                errorMsg.classList.remove('d-none');
                return;
            }

            if (newPassword !== confirmPassword) {
                errorMsg.textContent = "Passwords do not match.";
                errorMsg.classList.remove('d-none');
                return;
            }

            const originalBtnText = resetBtn.innerHTML;
            resetBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Resetting...';
            resetBtn.disabled = true;

            try {
                const responseMessage = await authService.resetPassword(token, newPassword);
                successMsg.textContent = responseMessage;
                successMsg.classList.remove('d-none');
                
                // Clear inputs
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
                
                // Redirect to login after 3 seconds
                setTimeout(() => {
                    window.location.href = 'admin-login.html';
                }, 3000);
            } catch (error) {
                errorMsg.textContent = error.response?.data?.message || "An error occurred while resetting the password. The link might be expired.";
                errorMsg.classList.remove('d-none');
            } finally {
                resetBtn.innerHTML = originalBtnText;
                resetBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
